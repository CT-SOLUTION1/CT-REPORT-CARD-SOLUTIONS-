<!-- ======================================================================
  FIREBASE (real, shared, cross-device database).
  This app now stores its data in Firestore instead of the browser, so a
  phone, a laptop, and a different person all see the SAME data.

  TO ACTIVATE (one-time, ~5 minutes, free):
   1. Go to https://console.firebase.google.com → "Add project" (any name).
   2. In the project, open Build → Firestore Database → "Create database"
      → choose "Start in test mode" (you can lock it down later).
   3. Open Project settings (gear icon) → General → "Your apps" → click
      the web icon (</>) → register an app (any nickname, no hosting needed).
   4. Firebase shows you a firebaseConfig object. Copy it and paste it
      below, replacing the placeholder values.
   5. Save this file and reload — the yellow "not connected" banner will
      disappear once it's working.
  Until you do this, the app runs in DEMO MODE (data stays only on this
  device) so you can still click through everything.
======================================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<style>
:root{
  --navy:#0A2A4A; --blue:#1D4E89; --blue-light:#E9F1FA; --gold:#C9A227;
  --ink:#132436; --paper:#FFFFFF; --muted:#5A7189; --danger:#B23A3A; --good:#1E7A46;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--blue-light);color:var(--ink);}
h1,h2,h3,.display{font-family:Georgia,'Playfair Display',serif;}
button{font-family:inherit;cursor:pointer;}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:700;font-size:14px;}
.btn:hover{background:var(--navy);}
.btn-outline{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:9px 16px;border-radius:6px;font-weight:700;}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:600;}
.btn-gold{background:var(--gold);color:#3a2c00;border:none;padding:10px 18px;border-radius:6px;font-weight:800;}
input,select,textarea{padding:9px 10px;border:1px solid #b9c9da;border-radius:5px;font-size:16px;width:100%;font-family:inherit;}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 10px rgba(10,42,74,.08);margin-bottom:18px;}
.topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.topbar .brand{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.02em;}
.topbar .brand span{color:var(--gold);}
.layout{display:flex;min-height:calc(100vh - 60px);flex-wrap:wrap;}
.sidebar{width:230px;background:var(--navy);color:#dce8f5;padding:16px 0;}
.sidebar a{display:block;padding:12px 22px;color:#dce8f5;text-decoration:none;font-size:14px;font-weight:600;border-left:4px solid transparent;}
.sidebar a.active,.sidebar a:hover{background:rgba(255,255,255,.08);border-left:4px solid var(--gold);}
.main{flex:1;min-width:280px;padding:26px;max-width:1150px;}
table{border-collapse:collapse;width:100%;background:#fff;}
table.report-table, table.data-table{border:2px solid var(--blue);}
table.report-table th, table.report-table td, table.data-table th, table.data-table td{border:1px solid var(--blue);padding:7px 9px;font-size:13px;text-align:center;}
table.report-table th, table.data-table th{background:var(--blue);color:#fff;text-transform:uppercase;font-size:11px;letter-spacing:.03em;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--blue));padding:20px;}
.auth-box{background:#fff;padding:36px;border-radius:14px;width:420px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.auth-tabs button{flex:1;min-width:90px;padding:9px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;font-weight:700;font-size:13px;}
.auth-tabs button.active{background:var(--blue);color:#fff;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--blue-light);color:var(--blue);}
.note{background:#FFF7E0;border:1px solid var(--gold);padding:12px 14px;border-radius:8px;font-size:13px;color:#5a4a00;}
.warn-banner{background:#7a1f1f;color:#fff;text-align:center;padding:8px 14px;font-size:13px;font-weight:600;}

.ok-banner{background:#0f5c33;color:#fff;text-align:center;padding:6px 14px;font-size:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.school-name-big{font-size:28px;font-weight:800;font-family:Georgia,serif;color:var(--navy);}
.photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--blue);}

/* ---- Report card ---- */
.rc-card{background:#fff;padding:20px 24px;}
.rc-topline{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:monospace;}
.rc-header{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--blue);padding-bottom:10px;margin-bottom:10px;}

  body *{visibility:hidden;}

<body>
<div id="app">Loading CT-E SOLUTIONS…</div>

<script>
/* ============================================================
   1. FIREBASE CONFIG — replace with your own project's values
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const FIREBASE_READY = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0;
let db = null, DEMO_MODE = !FIREBASE_READY;
if(FIREBASE_READY){
  try{ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  catch(e){ console.error(e); DEMO_MODE = true; }
}
const COLLECTION = 'cte_solutions';

/* ============================================================
   2. CONSTANTS
   ============================================================ */
// A-Level
const COMPULSORY = ['GENERAL PAPER'];
const SUBSIDIARIES = ['SUBSIDIARY MATHEMATICS','SUBSIDIARY COMPUTER'];
const A_OPTIONALS = ['BIOLOGY','CHEMISTRY','PHYSICS','MATHEMATICS','HISTORY','GEOGRAPHY','ECONOMICS',
  'ENTREPRENEURSHIP','CHRISTIAN REL. EDUC','ISLAMIC REL. EDUC','LITERATURE','KISWAHILI LANGUAGE','LUGANDA LANGUAGE',
  'AGRICULTURE','COMPUTER STUDIES'];
const SCIENCE_GROUP = ['AGRICULTURE','BIOLOGY','CHEMISTRY','PHYSICS','ECONOMICS'];

// O-Level
const O_LOWER_COMPULSORY = ['BIOLOGY','CHEMISTRY','PHYSICS','MATHEMATICS','HISTORY','GEOGRAPHY','ENGLISH','ENTREPRENEURSHIP','PHYSICAL EDUCATION']; // S.1 & S.2
const O_UPPER_COMPULSORY = ['BIOLOGY','CHEMISTRY','PHYSICS','MATHEMATICS','HISTORY','GEOGRAPHY','ENGLISH']; // S.3 & S.4
const O_OPTIONAL_BASE = ['CHRISTIAN REL. EDUC','ISLAMIC REL. EDUC','LITERATURE','KISWAHILI LANGUAGE','LUGANDA LANGUAGE','ICT (COMPUTER STUDIES)','AGRICULTURE','ART AND DESIGN'];

const ABBR = {'BIOLOGY':'BIO','CHEMISTRY':'CHEM','PHYSICS':'PHY','MATHEMATICS':'MATH','HISTORY':'HIST','GEOGRAPHY':'GEO',
  'ECONOMICS':'ECON','ENTREPRENEURSHIP':'ENT','CHRISTIAN REL. EDUC':'CRE','ISLAMIC REL. EDUC':'IRE','LITERATURE':'LIT',
  'KISWAHILI LANGUAGE':'KIS','LUGANDA LANGUAGE':'LUG','AGRICULTURE':'AGR','COMPUTER STUDIES':'COMP','ENGLISH':'ENG',
  'PHYSICAL EDUCATION':'PE','ICT (COMPUTER STUDIES)':'ICT','ART AND DESIGN':'ART'};

const GRADE_POINTS = {A:6,B:5,C:4,D:3,E:2,O:1,F:0};
const GRADE_COMMENT = {A:'Exceptional',B:'Outstanding',C:'Satisfactory',D:'Basic',E:'Elementary',O:'Pass',F:'Fail'};
const PASS_MARK_SUBSIDIARY = 35;
const DEFAULT_A_BANDS = {A:[80,100],B:[70,79],C:[60,69],D:[50,59],E:[40,49],O:[35,39],F:[0,34]};
const DEFAULT_O_BANDS = {A:[85,100],B:[70,84],C:[55,69],D:[40,54],E:[0,39]};
const DEFAULT_AOI_WEIGHT = 40; // % — remaining % goes to End of Term

function allSubjects(){
  return [...new Set([...COMPULSORY, ...SUBSIDIARIES, ...A_OPTIONALS, ...O_LOWER_COMPULSORY, ...O_UPPER_COMPULSORY,
    ...O_OPTIONAL_BASE, ...((DB.info && DB.info.oExtraSubjects) || [])])];
}
function oOptionalList(){ return [...O_OPTIONAL_BASE, ...((DB.info && DB.info.oExtraSubjects) || [])]; }
function oCompulsoryFor(form){ return (form==='S.1'||form==='S.2') ? O_LOWER_COMPULSORY : O_UPPER_COMPULSORY; }

/* ============================================================
   3. GLOBAL STATE
   ============================================================ */
let DB = { info:null, accounts:[], classes:[], students:[], assignments:[], scores:[], bands:null, obands:null };
let CUR = null;
let SCHOOL_ID = null;
let REGISTRY = [];
let SYSTEM_OWNER = null;
let VIEW = { name:'boot' };
let AUTH_VIEW = 'login';
let loginRole = 'admin';

/* ============================================================
   4. STORAGE LAYER
   "Shared" data → Firestore (real, cross-device, shared by everyone).
   "Personal" data → localStorage (only the current device's login session —
   that one SHOULD stay local, so each device can be logged in separately).
   ============================================================ */
async function getShared(key, fallback){
  if(DEMO_MODE){ try{ const raw = localStorage.getItem('cte_demo_'+key); return raw!==null? JSON.parse(raw): fallback; }catch(e){ return fallback; } }
  try{
    const snap = await db.collection(COLLECTION).doc(key).get();
    return snap.exists ? snap.data().value : fallback;
  }catch(e){ console.error(e); showFatal('Could not reach the database. Check your internet connection and Firestore setup.'); return fallback; }
}
async function setShared(key, val){
  if(DEMO_MODE){ try{ localStorage.setItem('cte_demo_'+key, JSON.stringify(val)); }catch(e){ console.error(e); } return; }
  try{ await db.collection(COLLECTION).doc(key).set({ value: val, updatedAt: Date.now() }); }
  catch(e){ console.error(e); showFatal('Could not save your change. Check your internet connection.'); }
}
async function getPersonal(key, fallback){
  try{ const raw = localStorage.getItem('cte_session_'+key); return raw!==null? JSON.parse(raw): fallback; }catch(e){ return fallback; }
}
async function setPersonal(key, val){ try{ localStorage.setItem('cte_session_'+key, JSON.stringify(val)); }catch(e){} }

async function loadAll(){
  REGISTRY = await getShared('schools_registry', []);
  SYSTEM_OWNER = await getShared('system_owner', null);
  const sess = await getPersonal('session', null);
  CUR = null; SCHOOL_ID = null;
  if(sess && sess.scope==='founder' && SYSTEM_OWNER){
    CUR = {role:'founder', name:'Founder', username:SYSTEM_OWNER.username};
  } else if(sess && sess.scope==='school'){
    const reg = REGISTRY.find(r=>r.id===sess.schoolId);
    if(reg && reg.status==='active'){
      await loadSchoolData(sess.schoolId);
      const acc = (DB.accounts||[]).find(a=>a.username===sess.username);
      if(acc && acc.status==='active'){ CUR = acc; SCHOOL_ID = sess.schoolId; }
    }
  }
}
async function loadSchoolData(id){
  DB.info = await getShared(`sch_${id}_info`, null);
  DB.accounts = await getShared(`sch_${id}_accounts`, []);
  DB.classes = await getShared(`sch_${id}_classes`, []);
  DB.students = await getShared(`sch_${id}_students`, []);
  DB.assignments = await getShared(`sch_${id}_assignments`, []);
  DB.scores = await getShared(`sch_${id}_scores`, []);
  DB.bands = await getShared(`sch_${id}_bands`, DEFAULT_A_BANDS);
  DB.obands = await getShared(`sch_${id}_obands`, DEFAULT_O_BANDS);
}
async function saveRegistry(){ await setShared('schools_registry', REGISTRY); }
async function saveSystemOwner(){ await setShared('system_owner', SYSTEM_OWNER); }
async function saveInfo(){ await setShared(`sch_${SCHOOL_ID}_info`, DB.info); }
async function saveAccounts(){ await setShared(`sch_${SCHOOL_ID}_accounts`, DB.accounts); }
async function saveClasses(){ await setShared(`sch_${SCHOOL_ID}_classes`, DB.classes); }
async function saveStudents(){ await setShared(`sch_${SCHOOL_ID}_students`, DB.students); }
async function saveAssignments(){ await setShared(`sch_${SCHOOL_ID}_assignments`, DB.assignments); }
async function saveScores(){ await setShared(`sch_${SCHOOL_ID}_scores`, DB.scores); }
async function saveBands(){ await setShared(`sch_${SCHOOL_ID}_bands`, DB.bands); }
async function saveOBands(){ await setShared(`sch_${SCHOOL_ID}_obands`, DB.obands); }

/* ============================================================
   5. HELPERS
   ============================================================ */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function initials(name){ if(!name) return '--'; const parts=name.trim().split(/\s+/); return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(); }
function esc(s){ return (s===null||s===undefined?'':s).toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return d; } }

function autoSubsidiary(principals){
  const hasMath = principals.includes('MATHEMATICS');
  const inScienceGroup = principals.some(p=>SCIENCE_GROUP.includes(p));
  if(inScienceGroup && !hasMath) return 'SUBSIDIARY COMPUTER';
  return 'SUBSIDIARY MATHEMATICS';
}
function combinationCode(principals){ return principals.map(p=>ABBR[p]||p.slice(0,3).toUpperCase()).join('/'); }

function studentSubjects(st, cls){
  if(!cls) return [];
  if(cls.level==='O') return [...oCompulsoryFor(cls.form), ...(st.subjects||[])];
  return [...(st.principals||[]), 'GENERAL PAPER', st.subsidiary];
}
function comboLabel(st, cls){
  if(cls && cls.level==='O') return (st.subjects&&st.subjects.length) ? st.subjects.map(s=>ABBR[s]||s.slice(0,4).toUpperCase()).join('/') : '—';
  return st.combination || '—';
}
function classOf(st){ return DB.classes.find(c=>c.id===st.classId); }

function rawScores(studentId, subject){
  return DB.scores.filter(s=>s.studentId===studentId && s.subject===subject && s.term===DB.info.currentTerm && s.year===DB.info.currentYear);
}
function subjectAverage(studentId, subject){
  const rows = rawScores(studentId, subject);
  const aoi = rows.filter(r=>r.kind==='AOI').map(r=>Number(r.marks));
  const eot = rows.filter(r=>r.kind==='EOT').map(r=>Number(r.marks));
  const aoiAvg = aoi.length ? aoi.reduce((a,b)=>a+b,0)/aoi.length : null;
  const eotAvg = eot.length ? eot.reduce((a,b)=>a+b,0)/eot.length : null;
  if(aoiAvg===null && eotAvg===null) return null;
  const w = (DB.info.aoiWeight!=null ? DB.info.aoiWeight : DEFAULT_AOI_WEIGHT) / 100;
  if(aoiAvg!==null && eotAvg!==null) return aoiAvg*w + eotAvg*(1-w);
  return aoiAvg!==null ? aoiAvg : eotAvg;
}
function gradeFor(subject, avg, level){
  if(level==='O'){
    const b = DB.obands || DEFAULT_O_BANDS;
    for(const g of ['A','B','C','D','E']) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
    return 'E';
  }
  if(subject==='GENERAL PAPER' || SUBSIDIARIES.includes(subject)) return avg>=PASS_MARK_SUBSIDIARY ? 'O':'F';
  const b = DB.bands || DEFAULT_A_BANDS;
  for(const g of ['A','B','C','D','E','O','F']) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
  return 'F';
}
function teacherForSubjectClass(subject, classId){
  const a = DB.assignments.find(a=>a.subject===subject && a.classId===classId);
  if(!a) return null;
  return DB.accounts.find(acc=>acc.username===a.teacherUsername) || null;
}
function maxPointsFor(st){ return (st.principals?st.principals.length:0)*6 + 1 + 1; }

function computeSubjectRows(st, cls){
  const subs = studentSubjects(st, cls);
  let totalPoints=0, sumAvg=0, countAvg=0;
  const rows = subs.map(subj=>{
    const avg = subjectAverage(st.id, subj);
    const grade = avg===null ? null : gradeFor(subj, avg, cls.level);
    let pts=0;
    if(cls.level==='A' && grade) pts = GRADE_POINTS[grade];
    if(avg!==null){ sumAvg+=avg; countAvg++; totalPoints+=pts; }
    const t = teacherForSubjectClass(subj, cls.id);
    return {subject:subj, avg, grade, pts, teacherInit: t?initials(t.name):'--'};
  });
  return { rows, totalPoints, avgPct: countAvg? sumAvg/countAvg : 0 };
}
function metricFor(st, cls){ const d = computeSubjectRows(st, cls); return cls.level==='A' ? d.totalPoints : d.avgPct; }
function classPosition(student, cls){
  const peers = DB.students.filter(s=>s.classId===cls.id);
  const scored = peers.map(s=>({id:s.id, m:metricFor(s, cls)})).sort((a,b)=>b.m-a.m);
  let position = scored.length;
  for(let i=0;i<scored.length;i++){
    if(i===0 || scored[i].m < scored[i-1].m) position = i+1;
    if(scored[i].id===student.id) return {position, size:peers.length};
  }
  return {position, size:peers.length};
}
function overallRemark(pct, who){
  if(who==='class'){
    if(pct>=0.75) return 'Excellent overall performance this term. Keep up the outstanding work.';
    if(pct>=0.5) return 'Good, steady performance. A little more effort will push results higher.';
    if(pct>=0.3) return 'Fair performance. Needs closer attention and more consistent study habits.';
    return 'Performance is below expectation. Requires serious improvement and support.';
  } else {
    if(pct>=0.75) return 'A commendable result — well done this term.';
    if(pct>=0.5) return 'A satisfactory result with clear room to grow.';
    if(pct>=0.3) return 'This result calls for renewed effort next term.';
    return 'This result is a serious concern and needs urgent action.';
  }
}

async function resizeImage(file, maxDim){
  return new Promise((res)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height){ if(width>maxDim){ height*=maxDim/width; width=maxDim; } }
        else{ if(height>maxDim){ width*=maxDim/height; height=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        res(canvas.toDataURL('image/jpeg',0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function fitOnePage(root){
  const inner = root.querySelector('.rc-card');
  if(!inner) return;
  inner.style.transform=''; inner.style.width='';
  const target = 1040;
  const h = inner.scrollHeight;
  if(h>target){
    const scale = target/h;
    inner.style.transformOrigin='top left';
    inner.style.transform=`scale(${scale})`;
    inner.style.width=(100/scale)+'%';
  }
}

/* ============================================================
   10. REPORT CARD (fits one page)
   ============================================================ */
function reportCardHTML(studentId, embedded){
  const s = DB.students.find(x=>x.id===studentId);
  if(!s) return '<p>Student not found.</p>';
  const cls = DB.classes.find(c=>c.id===s.classId);
  if(!cls) return '<p>This student has no class assigned.</p>';
  const { rows, totalPoints, avgPct } = computeSubjectRows(s, cls);
  const { position, size } = classPosition(s, cls);
  const isA = cls.level==='A';
  const maxP = isA ? maxPointsFor(s) : 100;
  const metric = isA ? totalPoints : avgPct;
  const pct = maxP ? metric/maxP : 0;

  const rowsHtml = rows.map(r=>{
    const aoiRows = rawScores(s.id, r.subject).filter(x=>x.kind==='AOI');
    const eotRow = rawScores(s.id, r.subject).find(x=>x.kind==='EOT');
    const aoiTxt = aoiRows.length? (aoiRows.reduce((a,b)=>a+Number(b.marks),0)/aoiRows.length).toFixed(0) : '-';
    const eotTxt = eotRow? eotRow.marks : '-';
    const comment = r.avg===null ? 'No marks yet' : `${r.grade}-${GRADE_COMMENT[r.grade]} (${r.teacherInit})`;
    return `<tr><td style="text-align:left;">${r.subject}</td><td>${aoiTxt}</td><td>${eotTxt}</td><td>${r.avg===null?'-':r.avg.toFixed(1)}</td><td>${r.grade||'-'}</td>${isA?`<td>${r.avg===null?0:r.pts}</td>`:''}<td style="text-align:left;">${comment}</td></tr>`;
  }).join('');

  const classTeacherAcc = DB.accounts.find(a=>a.username===cls.classTeacher);
  const ctInit = classTeacherAcc? initials(classTeacherAcc.name):'--';
  const htInit = initials(DB.info.headteacher||'Head Teacher');
  const bandsLegend = (isA? (DB.bands||DEFAULT_A_BANDS) : (DB.obands||DEFAULT_O_BANDS));

  return `
  <div id="printArea"><div class="rc-card">
    <div class="rc-topline"><span>${esc(DB.info.currentTerm||'')} ${esc(String(DB.info.currentYear||''))}</span><span>Printed ${fmtDate(Date.now())}</span></div>
    <div class="rc-header">
      ${DB.info.logo?`<img src="${DB.info.logo}">`:''}
      <div>
        <div class="rc-school-name">${esc(DB.info.schoolName)}</div>
        <div class="rc-contact">${esc(DB.info.address||'')}${DB.info.phone?' · Tel: '+esc(DB.info.phone):''}${DB.info.email?' · '+esc(DB.info.email):''}</div>
        <div class="pill" style="margin-top:4px;">${isA?'A-LEVEL':'O-LEVEL'} REPORT CARD</div>
      </div>
    </div>
    <div class="rc-bio">
      ${s.photo?`<img src="${s.photo}">`:'<div style="width:64px;height:64px;background:var(--blue-light);border-radius:6px;"></div>'}
      <div><b>Name:</b> ${esc(s.name)}</div><div><b>Class:</b> ${esc(cls.name)}</div>
      <div><b>Gender:</b> ${esc(s.gender||'—')}</div><div><b>Stream:</b> ${esc(cls.stream||'—')}</div>
      <div><b>Admission No:</b> ${esc(s.admNo)}</div><div><b>${isA?'Combination':'Subjects'}:</b> ${esc(comboLabel(s,cls))}</div>
      <div><b>Position:</b> ${position} out of ${size}</div><div><b>Class size:</b> ${size}</div>
    </div>
    <table class="report-table">
      <tr><th>Subject</th><th>AOI Avg</th><th>End of Term</th><th>Final Avg %</th><th>Grade</th>${isA?'<th>Points</th>':''}<th>Comment</th></tr>
      ${rowsHtml}
      <tr style="font-weight:800;background:var(--blue-light);"><td colspan="${isA?4:3}" style="text-align:right;">${isA?'TOTAL POINTS':'AVERAGE %'}</td>${isA?`<td colspan="1">${totalPoints} / ${maxP}</td>`:`<td colspan="2">${avgPct.toFixed(1)}%</td>`}<td></td></tr>
    </table>
    <div class="comment-box"><b>Class Teacher's comment:</b> ${overallRemark(pct,'class')} <i>(${ctInit})</i></div>
    <div class="comment-box"><b>Headteacher's comment:</b> ${overallRemark(pct,'head')} <i>(${htInit})</i></div>
    <div class="legend-strip">
      <span><b>Grading scale:</b></span>
      ${Object.keys(bandsLegend).map(g=>`<span>${g}: ${bandsLegend[g][0]}–${bandsLegend[g][1]}%</span>`).join('')}
    </div>
    <div class="footline">
      <span>Fees balance: ${s.feesBalance!=null?('UGX '+Number(s.feesBalance).toLocaleString()):'—'} · Next term fees: ${s.nextTermFees!=null?('UGX '+Number(s.nextTermFees).toLocaleString()):'—'}</span>
      <span>Term ends: ${fmtDate(DB.info.termEndDate)} · Next term begins: ${fmtDate(DB.info.nextTermBeginDate)}</span>
    </div>
  </div></div>
  ${embedded? '' : `<div class="flex" style="margin-top:10px;"><button class="btn" onclick="window.print()"><b>Print this report card</b></button>
  <button class="btn-outline" data-action="nav:reports">Back to list</button></div>`}`;
}

/* ============================================================
   11. ACTIONS
   ============================================================ */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  const [action, arg] = el.dataset.action.split(':');
  switch(action){
    case 'gotoCreateSchool': AUTH_VIEW='createSchool'; render(); break;
    case 'gotoTeacherSignup': AUTH_VIEW='signupTeacher'; render(); break;
    case 'gotoParentSignup': AUTH_VIEW='signupParent'; render(); break;
    case 'gotoFounderLogin': AUTH_VIEW='founderLogin'; render(); break;
    case 'gotoLogin': AUTH_VIEW='login'; render(); break;
    case 'setRole': loginRole = arg; render(); break;
    case 'logout': CUR=null; SCHOOL_ID=null; await setPersonal('session', null); render(); break;
    case 'nav': VIEW = {name:arg, params:{}}; render(); break;
    case 'viewReport': {
      document.getElementById('app').innerHTML = renderShellWithContent(reportCardHTML(arg,false));
      const root = document.getElementById('mainArea'); if(root) fitOnePage(root);
      break;
    }
    case 'delClass': DB.classes = DB.classes.filter(c=>c.id!==arg); await saveClasses(); render(); break;
    case 'delStudent': DB.students = DB.students.filter(s=>s.id!==arg); await saveStudents(); render(); break;
    case 'delAssign': DB.assignments = DB.assignments.filter(a=>a.id!==arg); await saveAssignments(); render(); break;
    case 'delOSubject': {
      const name = decodeURIComponent(arg);
      DB.info.oExtraSubjects = (DB.info.oExtraSubjects||[]).filter(s=>s!==name);
      await saveInfo(); render(); break;
    }
    case 'bulkPdf': await bulkPdf(arg||null); break;
    case 'approveAcc': { const code=prompt('Enter your private owner code to approve:'); if(code===null) break;
      if(code!==DB.info.ownerCode){ alert('Incorrect owner code.'); break; }
      const acc = DB.accounts.find(a=>a.username===arg); if(acc){ acc.status='active'; await saveAccounts(); render(); } break; }
    case 'rejectAcc': { const code=prompt('Enter your private owner code to reject:'); if(code===null) break;
      if(code!==DB.info.ownerCode){ alert('Incorrect owner code.'); break; }
      DB.accounts = DB.accounts.filter(a=>a.username!==arg); await saveAccounts(); render(); break; }
    case 'closeAcc': { const code=prompt('Enter your private owner code to close this account:'); if(code===null) break;
      if(code!==DB.info.ownerCode){ alert('Incorrect owner code.'); break; }
      const acc = DB.accounts.find(a=>a.username===arg); if(acc){ acc.status='closed'; await saveAccounts(); render(); } break; }
    case 'reopenAcc': { const code=prompt('Enter your private owner code to reopen:'); if(code===null) break;
      if(code!==DB.info.ownerCode){ alert('Incorrect owner code.'); break; }
      const acc = DB.accounts.find(a=>a.username===arg); if(acc){ acc.status='active'; await saveAccounts(); render(); } break; }
    case 'foundApprove': { const code=prompt('Enter your founder code to approve this school:'); if(code===null) break;
      if(code!==SYSTEM_OWNER.code){ alert('Incorrect founder code.'); break; }
      const r = REGISTRY.find(x=>x.id===arg); if(r){ r.status='active'; await saveRegistry(); render(); } break; }
    case 'foundReject': { const code=prompt('Enter your founder code to reject this school:'); if(code===null) break;
      if(code!==SYSTEM_OWNER.code){ alert('Incorrect founder code.'); break; }
      REGISTRY = REGISTRY.filter(x=>x.id!==arg); await saveRegistry(); render(); break; }
    case 'foundClose': { const code=prompt('Enter your founder code to disconnect this school:'); if(code===null) break;
      if(code!==SYSTEM_OWNER.code){ alert('Incorrect founder code.'); break; }
      const r = REGISTRY.find(x=>x.id===arg); if(r){ r.status='closed'; await saveRegistry(); render(); } break; }
    case 'foundReopen': { const code=prompt('Enter your founder code to reconnect this school:'); if(code===null) break;
      if(code!==SYSTEM_OWNER.code){ alert('Incorrect founder code.'); break; }
      const r = REGISTRY.find(x=>x.id===arg); if(r){ r.status='active'; await saveRegistry(); render(); } break; }
  }
});
function renderShellWithContent(innerHtml){
  const shell = renderShell();
  return shell.replace(/<div class="main"[^>]*>[\s\S]*<\/div>\s*<\/div>\s*$/, `<div class="main" id="mainArea">${innerHtml}</div></div>`);
}

document.addEventListener('change', (e)=>{
  if(e.target.id==='clsLevel'){
    document.getElementById('formWrap').style.display = e.target.value==='O' ? 'block':'none';
  }
  if(e.target.id==='stuClassSel'){
    const cls = DB.classes.find(c=>c.id===e.target.value);
    const level = cls ? cls.level : '';
    const aBlock = document.getElementById('aLevelBlock'), oBlock = document.getElementById('oLevelBlock');
    if(aBlock) aBlock.style.display = level==='A' ? 'block':'none';
    if(oBlock) oBlock.style.display = level==='O' ? 'block':'none';
    if(level==='O'){
      const wrap = document.getElementById('oOptWrap');
      if(wrap){
        wrap.innerHTML = oOptionalList().map(s=>
          `<label style="text-transform:none;font-weight:400;display:flex;gap:6px;align-items:center;"><input type="checkbox" name="subjects" value="${s}" style="width:auto;">${s}</label>`
        ).join('');
      }
    }
  }
  if(e.target.id==='kindSel'){
    const wrap = document.getElementById('labelWrap');
    if(wrap) wrap.style.display = e.target.value==='AOI' ? 'block':'none';
  }
  if(e.target.name==='assignId'){
    const form = e.target.closest('form');
    const mine = DB.assignments.filter(a=>a.teacherUsername===CUR.username);
    const a = mine.find(x=>x.id===e.target.value);
    const paperSel = form.querySelector('#paperSelect');
    if(a && paperSel){ paperSel.innerHTML = a.papers.map(p=>`<option value="${p}">Paper ${p}</option>`).join(''); }
  }
  if(e.target.name==='role' && e.target.id==='roleSel'){
    document.getElementById('parentLinkWrap').style.display = e.target.value==='parent'?'block':'none';
  }
});

document.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = e.target;
  const type = form.dataset.form;
  const fd = new FormData(form);
  try{
    if(type==='founderSetup'){
      const missing = ['name','username','password','code'].filter(k=>!fd.get(k) || !fd.get(k).trim());
      if(missing.length){ showFatal('Please fill in: '+missing.join(', ')); return; }
      SYSTEM_OWNER = {name:fd.get('name'), username:fd.get('username'), password:fd.get('password'), code:fd.get('code')};
      await saveSystemOwner();
      await setPersonal('session', {scope:'founder'});
      CUR = {role:'founder', name:SYSTEM_OWNER.name, username:SYSTEM_OWNER.username};
      render();
    }
    else if(type==='founderLogin'){
      const u=fd.get('username'), p=fd.get('password');
      if(SYSTEM_OWNER && SYSTEM_OWNER.username===u && SYSTEM_OWNER.password===p){
        await setPersonal('session', {scope:'founder'});
        CUR = {role:'founder', name:SYSTEM_OWNER.name, username:u}; render();
      } else { document.getElementById('loginErr').textContent = 'Invalid founder username or password.'; }
    }
    else if(type==='founderPassword'){
      if(SYSTEM_OWNER.password!==fd.get('oldPassword') || SYSTEM_OWNER.code!==fd.get('oldCode')){ alert('Current password or code is incorrect.'); return; }
      if(fd.get('newPassword')) SYSTEM_OWNER.password = fd.get('newPassword');
      if(fd.get('newCode')) SYSTEM_OWNER.code = fd.get('newCode');
      await saveSystemOwner(); alert('Updated.');
    }
    else if(type==='createSchool'){
      const req = ['schoolName','headteacher','username','password','ownerCode'];
      const missing = req.filter(k=>!fd.get(k) || !fd.get(k).trim());
      if(missing.length){ showFatal('Please fill in: '+missing.join(', ')); return; }
      const id = uid('s');
      REGISTRY.push({id, name:fd.get('schoolName'), ownerUsername:fd.get('username'), status:'pending', createdAt:Date.now()});
      await saveRegistry();
      SCHOOL_ID = id;
      DB.info = { schoolName:fd.get('schoolName'), address:fd.get('address')||'', phone:fd.get('phone')||'', email:fd.get('email')||'',
        motto:fd.get('motto')||'', headteacher:fd.get('headteacher'), logo:null, currentTerm:'Term 1', currentYear:new Date().getFullYear(),
        ownerCode:fd.get('ownerCode'), aoiWeight:DEFAULT_AOI_WEIGHT, oExtraSubjects:[], termEndDate:'', nextTermBeginDate:'' };
      DB.accounts = [{username:fd.get('username'), password:fd.get('password'), role:'admin', name:'School Owner', status:'active'}];
      DB.classes=[]; DB.students=[]; DB.assignments=[]; DB.scores=[]; DB.bands=DEFAULT_A_BANDS; DB.obands=DEFAULT_O_BANDS;
      await Promise.all([saveInfo(),saveAccounts(),saveClasses(),saveStudents(),saveAssignments(),saveScores(),saveBands(),saveOBands()]);
      SCHOOL_ID = null; DB = { info:null, accounts:[], classes:[], students:[], assignments:[], scores:[], bands:null, obands:null };
      alert('Your school has been submitted. It will work once the CT-E SOLUTIONS founder approves it.');
      AUTH_VIEW='login'; render();
    }
    else if(type==='signupTeacher' || type==='signupParent'){
      const schoolId = fd.get('schoolId');
      if(!schoolId){ showFatal('Please choose your school.'); return; }
      if(!fd.get('name') || !fd.get('username') || (fd.get('password')||'').length<4){ showFatal('Please fill in all fields (password at least 4 characters).'); return; }
      const accounts = await getShared(`sch_${schoolId}_accounts`, []);
      if(accounts.some(a=>a.username===fd.get('username'))){ showFatal('That username is already taken at this school.'); return; }
      if(type==='signupTeacher'){
        accounts.push({username:fd.get('username'), password:fd.get('password'), role:'teacher', name:fd.get('name'), status:'pending'});
      } else {
        const students = await getShared(`sch_${schoolId}_students`, []);
        const st = students.find(s=>s.admNo===fd.get('childAdmNo'));
        accounts.push({username:fd.get('username'), password:fd.get('password'), role:'parent', name:fd.get('name'),
          status:'pending', studentId: st? st.id: null, pendingAdmNo: st? null: fd.get('childAdmNo')});
      }
      await setShared(`sch_${schoolId}_accounts`, accounts);
      alert('Request submitted. The school owner must approve your account before you can sign in.');
      AUTH_VIEW='login'; render();
    }
    else if(type==='login'){
      const schoolId = fd.get('schoolId'), role=fd.get('role'), u=fd.get('username'), p=fd.get('password');
      if(!schoolId){ document.getElementById('loginErr').textContent='Please choose your school.'; return; }
      const reg = REGISTRY.find(r=>r.id===schoolId);
      if(!reg || reg.status!=='active'){ document.getElementById('loginErr').textContent='This school is not active.'; return; }
      await loadSchoolData(schoolId);
      const acc = DB.accounts.find(a=>a.username===u && a.password===p && a.role===role);
      let err='';
      if(!acc) err='Invalid username, password, or role.';
      else if(acc.status==='pending') err='This account is awaiting owner approval.';
      else if(acc.status==='closed') err='This account has been closed.';
      document.getElementById('loginErr').textContent = err;
      if(acc && !err){ CUR=acc; SCHOOL_ID=schoolId; await setPersonal('session', {scope:'school', schoolId, username:u}); render(); }
    }
    else if(type==='setTerm'){
      DB.info.currentTerm=fd.get('term'); DB.info.currentYear=fd.get('year');
      DB.info.termEndDate=fd.get('termEndDate'); DB.info.nextTermBeginDate=fd.get('nextTermBeginDate');
      await saveInfo(); render();
    }
    else if(type==='schoolInfo'){
      const file = fd.get('logo');
      if(file && file.size>0){ DB.info.logo = await resizeImage(file,200); }
      DB.info.schoolName=fd.get('schoolName'); DB.info.address=fd.get('address'); DB.info.phone=fd.get('phone');
      DB.info.email=fd.get('email'); DB.info.motto=fd.get('motto'); DB.info.headteacher=fd.get('headteacher');
      await saveInfo(); render();
    }
    else if(type==='addClass'){
      DB.classes.push({id:uid('cls'), name:fd.get('name'), level:fd.get('level'), form: fd.get('level')==='O'?fd.get('form'):null,
        stream:fd.get('stream')||'', classTeacher:fd.get('classTeacher')||null});
      await saveClasses(); form.reset(); render();
    }
    else if(type==='createAccount'){
      const role = fd.get('role');
      if(DB.accounts.some(a=>a.username===fd.get('username'))){ alert('Username already taken.'); return; }
      DB.accounts.push({username:fd.get('username'), password:fd.get('password'), role, name:fd.get('name'),
        status:'active', studentId: role==='parent'? (fd.get('studentId')||null) : null});
      await saveAccounts(); render();
    }
    else if(type==='addOSubject'){
      const name = (fd.get('subjectName')||'').trim().toUpperCase();
      if(!name) return;
      DB.info.oExtraSubjects = DB.info.oExtraSubjects || [];
      if(!DB.info.oExtraSubjects.includes(name)) DB.info.oExtraSubjects.push(name);
      await saveInfo(); form.reset(); render();
    }
    else if(type==='addStudent'){
      const clsSel = form.querySelector('#stuClassSel');
      const cls = DB.classes.find(c=>c.id===clsSel.value);
      if(!cls){ alert('Please select a class.'); return; }
      const file = fd.get('photo');
      const photo = (file && file.size>0) ? await resizeImage(file,220) : null;
      const feesBalance = fd.get('feesBalance')!==''? Number(fd.get('feesBalance')) : null;
      const nextTermFees = fd.get('nextTermFees')!==''? Number(fd.get('nextTermFees')) : null;
      const base = {id:uid('std'), name:fd.get('name'), admNo:fd.get('admNo'), classId:cls.id, photo, gender:fd.get('gender')||null, feesBalance, nextTermFees};
      if(cls.level==='A'){
        const principals = fd.getAll('principals');
        if(principals.length!==3){ alert('Please select exactly 3 principal subjects.'); return; }
        const subsidiary = autoSubsidiary(principals);
        DB.students.push({...base, principals, subsidiary, combination: combinationCode(principals), subjects:null});
      } else {
        const subjects = fd.getAll('subjects');
        DB.students.push({...base, subjects, principals:null, subsidiary:null, combination:null});
      }
      await saveStudents(); form.reset(); render();
    }
    else if(type==='assignSubject'){
      const papers = fd.get('papers').split(',').map(p=>p.trim()).filter(Boolean);
      DB.assignments.push({id:uid('asn'), teacherUsername:fd.get('teacherUsername'), classId:fd.get('classId'), subject:fd.get('subject'), papers});
      await saveAssignments(); form.reset(); render();
    }
    else if(type==='saveBands'){
      const b={...(DB.bands||DEFAULT_A_BANDS)}; ['A','B','C','D','E'].forEach(g=>{ b[g]=[Number(fd.get(g+'min')),Number(fd.get(g+'max'))]; });
      DB.bands=b; await saveBands(); render();
    }
    else if(type==='saveOBands'){
      const b={...(DB.obands||DEFAULT_O_BANDS)}; ['A','B','C','D','E'].forEach(g=>{ b[g]=[Number(fd.get(g+'min')),Number(fd.get(g+'max'))]; });
      DB.obands=b; await saveOBands(); render();
    }
    else if(type==='saveWeight'){
      DB.info.aoiWeight = Math.max(0,Math.min(100,Number(fd.get('aoiWeight'))));
      await saveInfo(); render();
    }
    else if(type==='promote'){
      const from=fd.get('fromClass'), to=fd.get('toClass');
      DB.students.forEach(s=>{ if(s.classId===from) s.classId=to; });
      await saveStudents(); alert('Students promoted successfully.'); render();
    }
    else if(type==='changePassword'){
      if(CUR.password!==fd.get('old')){ alert('Current password is incorrect.'); return; }
      CUR.password=fd.get('new');
      const idx = DB.accounts.findIndex(a=>a.username===CUR.username);
      DB.accounts[idx]=CUR; await saveAccounts(); alert('Password updated.');
    }
    else if(type==='pickPaper'){
      VIEW={name:'tscores', params:{assignId:fd.get('assignId'), paper:fd.get('paper'), kind:fd.get('kind'), label:fd.get('label')||''}}; render();
    }
    else if(type==='saveScores'){
      const assignId=form.dataset.assign, paper=form.dataset.paper, subject=form.dataset.subject, kind=form.dataset.kind, label=form.dataset.label;
      for(const [key,val] of fd.entries()){
        if(!key.startsWith('m_')) continue;
        const studentId = key.slice(2);
        if(kind==='EOT'){
          const idx = DB.scores.findIndex(sc=>sc.studentId===studentId && sc.subject===subject && sc.paper==paper && sc.kind==='EOT' && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
          const row = {id: idx>=0?DB.scores[idx].id:uid('sc'), studentId, subject, paper, kind:'EOT', label:'', term:DB.info.currentTerm, year:DB.info.currentYear, marks:Number(val), teacher:CUR.username};
          if(idx>=0) DB.scores[idx]=row; else DB.scores.push(row);
        } else {
          DB.scores.push({id:uid('sc'), studentId, subject, paper, kind:'AOI', label, term:DB.info.currentTerm, year:DB.info.currentYear, marks:Number(val), teacher:CUR.username});
        }
      }
      await saveScores(); alert('Scores saved and sent.'); render();
    }
  }catch(err){ console.error(err); alert('Something went wrong. Please try again.'); }
});

/* ---------- Bulk PDF ---------- */
async function bulkPdf(classId){
  const students = DB.students.filter(s=>!classId || s.classId===classId);
  if(!students.length){ alert('No students to export.'); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','pt','a4');
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.width='780px'; holder.style.background='#fff';
  document.body.appendChild(holder);
  for(let i=0;i<students.length;i++){
    holder.innerHTML = `<div style="padding:14px;font-family:Inter,sans-serif;">${reportCardHTML(students[i].id, true)}</div>`;
    fitOnePage(holder);
    const canvas = await html2canvas(holder, {scale:2});
    const img = canvas.toDataURL('image/jpeg',0.92);
    const w = pdf.internal.pageSize.getWidth(); const h = canvas.height*w/canvas.width;
    if(i>0) pdf.addPage();
    pdf.addImage(img,'JPEG',0,0,w,h);
  }
  document.body.removeChild(holder);
  pdf.save(`${DB.info.schoolName.replace(/\s+/g,'_')}_reports.pdf`);
}

/* ---------- Error visibility ---------- */
function showFatal(msg){
  let bar = document.getElementById('fatalBar');
  if(!bar){ bar=document.createElement('div'); bar.id='fatalBar';
    bar.style.cssText='position:fixed;top:0;left:0;right:0;background:#B23A3A;color:#fff;padding:12px 18px;font-family:Inter,sans-serif;font-size:14px;z-index:9999;box-shadow:0 2px 10px rgba(0,0,0,.3);';
    document.body.prepend(bar); }
  bar.innerHTML = '<b>Something went wrong:</b> ' + esc(String(msg)) + ' <span style="float:right;cursor:pointer;font-weight:800;" onclick="this.parentElement.remove()">✕</span>';
}
window.addEventListener('error', (e)=>{ showFatal(e.message); });
window.addEventListener('unhandledrejection', (e)=>{ showFatal(e.reason && e.reason.message ? e.reason.message : e.reason); });

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch((e)=>console.warn('Service worker not registered:', e));
  });
}

  try{ await loadAll(); render(); }
  catch(e){ showFatal(e.message); document.getElementById('app').innerHTML='<div style="padding:40px;">Could not start. See error above.</div>'; }
})();
